name: Publish desktop update
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and publish update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Release-GitHub.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME
